nelmio_cors:
    defaults:
        allow_origin: []
        allow_credentials: false
        allow_headers: ['Content-Type', 'Authorization', 'Accept']
        expose_headers: ['Link']
        allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
        max_age: 3600
    paths:
        '^/api/':
            # Origines autorisées : expression régulière définie dans .env (CORS_ALLOW_ORIGIN)
            # - en local : localhost / 127.0.0.1, tous ports (Vite sur 5173, etc.)
            # - en production : inutile si le frontend est servi par le même site que l'API
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_credentials: false
            allow_headers: ['Content-Type', 'Authorization', 'Accept']
            allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
            max_age: 3600
